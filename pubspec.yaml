name: shared_database
description: >
  Importable Flutter plugin — shared on-device SQLite with collection CRUD for
  your apps on Android and Windows.
version: 1.5.0+6
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  uuid: ^4.5.1
  shared_database_android:
    path: ./shared_database_android
  shared_database_windows:
    path: ./shared_database_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.2

flutter:
  plugin:
    platforms:
      android:
        default_package: shared_database_android
      windows:
        default_package: shared_database_windows