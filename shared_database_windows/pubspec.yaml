name: shared_database_windows
description: Windows implementation for the shared_database plugin.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: shared_database
    platforms:
      windows:
        pluginClass: SharedDatabaseWindowsPluginCApi
